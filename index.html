<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b5b'/%3E%3Cstop offset='1' stop-color='%23ffb199'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cg transform='rotate(-60 32 32)'%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-dasharray='101 25'/%3E%3C/g%3E%3Cpolyline points='21,37.5 29,30.5 37,35 44,26' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>研心</title>
<style>
:root{
  --bg-1:#0f1115; --bg-2:#1a1d24;
  --card-bg:#181b22;
  --card-stroke:rgba(255,255,255,0.06);
  --text:#f5f6f8; --text-dim:#9aa0aa; --text-faint:#5a606b;
  --accent:#ff6b5b; --accent-soft:rgba(255,107,91,0.15);
  --ok:#4ade80; --warn:#facc15;
  --radius:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* 注意：不能给 html,body 设 height:100%，否则 body 被固定为视口高度，
   flex 子项会因默认 flex-shrink:1 被压缩，再被 .card{overflow:hidden} 裁掉内容 */
html{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:radial-gradient(120% 80% at 50% 0%,#22262f 0%,#0f1115 60%);
  color:var(--text); min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:24px 16px calc(96px + env(safe-area-inset-bottom));   /* 底部留出 Dock 栏空间 */
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}

/* ============ 原生日期/时间选择器：跟随深色主题 ============ */
input[type="date"],input[type="time"]{color-scheme:dark}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{
  filter:invert(1) opacity(.5);cursor:pointer;transition:filter .2s;
}
input[type="date"]::-webkit-calendar-picker-indicator:hover,
input[type="time"]::-webkit-calendar-picker-indicator:hover{filter:invert(1) opacity(.95)}
input[type="date"]:hover,input[type="time"]:hover{border-color:rgba(255,255,255,0.18)}

/* ============ 头部 ============ */
.app-header{
  width:100%;max-width:860px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:18px;flex-wrap:wrap;
  flex-shrink:0;   /* 禁止被压缩 */
}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff6b5b,#ffb199);display:grid;place-items:center;font-size:18px;font-weight:700;box-shadow:0 6px 18px rgba(255,107,91,0.25)}
.brand-name{font-size:18px;font-weight:700;letter-spacing:1px}

/* ============ 卡片 ============ */
.card{
  width:100%;max-width:860px;
  background:linear-gradient(180deg,#1d212b 0%,#15181f 100%);
  border:1px solid var(--card-stroke);
  border-radius:var(--radius);
  box-shadow:0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  overflow:hidden;position:relative;
  margin-bottom:20px;
  flex-shrink:0;   /* 关键：禁止 flex 压缩，否则内容会被 overflow:hidden 裁掉 */
  flex-grow:0;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:18px 20px;flex-wrap:wrap;
}
.card-inner{padding:8px 20px 22px}

.btn{
  appearance:none;border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.04);color:var(--text);
  padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  transition:all .25s ease;min-height:42px;-webkit-tap-highlight-color:transparent;
  flex-shrink:0;
}
.btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0d0b}
.btn.primary:hover{background:#ff7f70}
.btn.ghost{background:transparent}
.btn .ic{font-size:15px}

/* ============ 倒计时卡片 ============ */
/* 卡片顶部柔光氛围：从顶部晕开的暖色光，营造纵深与呼吸感 */
#cdCard::before{
  content:"";position:absolute;top:-150px;left:50%;transform:translateX(-50%);
  width:720px;height:500px;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,rgba(255,107,91,.15),rgba(255,107,91,0) 70%);
}
#cdCard.layout-landscape::before{left:64%}
#cdCard .card-inner{position:relative;z-index:1}

/* 默认：竖版 column 布局（适合窄屏/手机） */
#cdCard .card-inner{
  display:flex;flex-direction:column;align-items:center;
  padding:18px 24px 26px;gap:24px;min-width:0;width:100%;
  transition:all .4s cubic-bezier(.4,0,.2,1);
}
.cd-side{
  display:flex;flex-direction:column;align-items:center;
  min-width:0;width:100%;flex:none; /* flex:none 防止被挤压 */
}
.cd-target{
  font-size:14px;color:var(--text-dim);font-weight:500;letter-spacing:.3px;
  display:flex;align-items:center;gap:8px;
  max-width:100%;flex-wrap:wrap;justify-content:center;
}
.cd-target .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2s ease-in-out infinite;flex-shrink:0}
.cd{
  display:flex;align-items:baseline;gap:10px;margin-top:14px;
  flex-wrap:nowrap;justify-content:center;max-width:100%;
}
.cd .num{
  font-size:clamp(66px,17vw,118px);font-weight:200;
  letter-spacing:-4px;line-height:.95;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#ffffff 25%,#aeb4c0);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  white-space:nowrap;min-width:0;
}
.cd .unit{font-size:15px;color:var(--text-dim);font-weight:400;flex-shrink:0;transform:translateY(-6px)}
.cd .sub{
  font-size:clamp(22px,6vw,38px);font-weight:250;color:var(--text-dim);
  letter-spacing:2px;font-variant-numeric:tabular-nums;flex-shrink:0;
}
.cd-progress{
  width:100%;max-width:420px;height:6px;border-radius:6px;
  background:rgba(255,255,255,0.06);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35);
  overflow:hidden;margin-top:20px;flex-shrink:0;
}
.cd-progress>i{
  display:block;height:100%;width:0%;border-radius:6px;
  background:linear-gradient(90deg,#ff6b5b,#ffb199);
  box-shadow:0 0 12px rgba(255,107,91,.55);
  transition:width 1s linear;
}
.ctrl-side{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  width:100%;max-width:460px;flex:none;
}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hint{margin-top:2px;font-size:12px;color:var(--text-faint)}
.done{font-size:18px;color:var(--ok);font-weight:500;letter-spacing:1px;margin-top:8px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 横版 row 布局（电脑端恒横版 / 手机横屏） */
#cdCard.layout-landscape .card-inner{
  flex-direction:row;align-items:center;justify-content:space-between;
  padding:18px 28px;gap:28px;
}
#cdCard.layout-landscape .cd-side{
  order:2;align-items:flex-start;
  flex:1 1 55%;min-width:0;
}
#cdCard.layout-landscape .ctrl-side{
  order:1;align-items:flex-start;
  flex:0 0 auto;max-width:38%;
}
#cdCard.layout-landscape .cd{justify-content:flex-start}
#cdCard.layout-landscape .cd .num{font-size:clamp(58px,10vw,106px)}
#cdCard.layout-landscape .cd .sub{font-size:clamp(22px,4.5vw,36px)}
#cdCard.layout-landscape .cd-target{justify-content:flex-start}
#cdCard.layout-landscape .cd-progress{max-width:360px}

/* ============ 成绩卡片 ============ */
.sub-nav{display:flex;gap:6px;flex-wrap:wrap}
.sub-nav .tab{padding:8px 14px;border-radius:10px;font-size:13px;color:var(--text-dim);background:transparent;border:none;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.sub-nav .tab.active{background:rgba(255,255,255,0.08);color:var(--text)}

/* 科目网格：窄版（手机 / 电脑竖屏）2 列，宽版 3/5 列。
   由 body.mode-* class 驱动，与倒计时方向决策同源，
   保证「电脑竖屏」与「手机竖屏」渲染出完全相同的界面 */
.subject-grid{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.sg-group-label{font-size:11px;color:var(--text-faint);letter-spacing:2px}
.sg-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
body.mode-landscape .sg-row{grid-template-columns:repeat(3,1fr)}
body.mode-landscape .sg-row.multi{grid-template-columns:repeat(5,1fr)}
.subject-card{
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
  border-radius:16px;padding:12px 10px;cursor:pointer;transition:all .2s;
  display:flex;flex-direction:column;gap:3px;position:relative;min-width:0;
}
.subject-card:hover{background:rgba(255,255,255,0.06)}
.subject-card.selected{border-color:var(--accent);background:var(--accent-soft)}
.subject-card.selected::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--accent);font-size:13px;font-weight:700}
.subject-card .s-name{font-size:13px;font-weight:600;line-height:1.3}

.sub-select{margin-top:12px}
.sub-select .field{margin-bottom:0}

/* 录入 */
.input-top{display:flex;gap:12px;align-items:flex-end;margin-bottom:6px}
.input-top .field{flex:1}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,0.05)}
.score-row:last-child{border-bottom:none}
.score-row .lbl{font-size:13px;color:var(--text-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-row input{
  width:100%;min-width:0;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;padding:8px 8px;color:var(--text);font-size:14px;text-align:right;outline:none;
  font-variant-numeric:tabular-nums;
}
.score-row input:focus{border-color:var(--accent)}
.score-row .full-lbl{font-size:11px;color:var(--text-faint);text-align:right}
.section-block{
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
  border-radius:14px;padding:12px 14px;margin-top:10px;
}
.section-block h4{font-size:13px;color:var(--text-dim);margin-bottom:8px;letter-spacing:1px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-block h4 .full{color:var(--text-faint);font-weight:400}
.section-block h4 .h4-right{display:flex;align-items:center;gap:10px}
.calc-btn{
  appearance:none;border:1px solid rgba(255,107,91,0.4);background:rgba(255,107,91,0.12);
  color:var(--accent);padding:5px 12px;border-radius:9px;font-size:12px;font-weight:500;
  cursor:pointer;transition:all .2s;min-height:30px;-webkit-tap-highlight-color:transparent;
}
.calc-btn:hover{background:rgba(255,107,91,0.22);border-color:var(--accent)}
.calc-btn:active{transform:scale(.95)}
.grand-block{background:linear-gradient(180deg,rgba(255,107,91,0.08),rgba(255,107,91,0.02));border-color:rgba(255,107,91,0.25)}
.rec-title{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-sub{font-size:11px;color:var(--text-faint);margin-top:2px}
.total-row-highlight{background:var(--accent-soft);border-radius:8px;padding:4px 8px;margin-top:4px}
.input-actions{display:flex;gap:10px;margin-top:16px}
.input-actions .btn{flex:1;justify-content:center}
.auto-status{margin-top:10px;font-size:12px;color:var(--text-faint);text-align:center;min-height:16px;transition:color .2s}
.auto-status.bad{color:var(--warn)}
.records-wrap{margin-top:20px;border-top:1px dashed rgba(255,255,255,0.08);padding-top:14px}
.rec-item{
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
  border-radius:14px;padding:11px 12px;margin-top:8px;
  transition:border-color .2s,background .2s;
}
.rec-item.on{border-color:rgba(255,107,91,0.45);background:rgba(255,107,91,0.08)}
.rec-score{
  flex-shrink:0;min-width:60px;text-align:center;
  background:rgba(255,107,91,0.1);border:1px solid rgba(255,107,91,0.25);
  border-radius:12px;padding:9px 12px;
}
.rec-score b{display:block;font-size:20px;font-weight:600;line-height:1.15;color:var(--accent);font-variant-numeric:tabular-nums}
.rec-info{flex:1;min-width:0}
.rec-time{display:block;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-date{font-weight:400;font-size:11px;color:var(--text-faint);margin-left:6px}
.rec-acts{display:flex;gap:6px;flex-shrink:0}
.rec-btn{
  appearance:none;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);
  color:var(--text-dim);padding:6px 11px;border-radius:10px;font-size:12px;cursor:pointer;
  transition:all .2s;min-height:30px;-webkit-tap-highlight-color:transparent;
}
.rec-btn:hover{background:rgba(255,255,255,0.1);color:var(--text)}
.rec-btn.danger:hover{border-color:rgba(255,107,91,0.5);color:var(--accent);background:rgba(255,107,91,0.12)}
.empty-tip{color:var(--text-faint);font-size:14px;text-align:center;padding:40px 0}

/* 分析 */
.analyze-hero{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.analyze-hero .total{display:flex;flex-direction:column}
.analyze-hero .total .v{font-size:44px;font-weight:200;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#c9ced8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.analyze-hero .total .l{font-size:12px;color:var(--text-dim);letter-spacing:2px;margin-top:4px}
.analyze-hero .meta{font-size:13px;color:var(--text-faint);line-height:1.8}
.section-label{font-size:12px;color:var(--text-faint);letter-spacing:1px;margin-top:12px}

.bar-chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding:14px 0 22px;border-bottom:1px solid rgba(255,255,255,0.06);margin:8px 0 0}
.bar-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar-chart .bar{width:64%;max-width:44px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#ff6b5b,#ffb199);position:relative;transition:height .6s cubic-bezier(.4,0,.2,1);min-height:2px}
.bar-chart .bar .val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-chart .col .name{font-size:11px;color:var(--text-dim);margin-top:6px;text-align:center;line-height:1.3;word-break:break-all}
.bar-chart .pct-label{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--text-faint)}

/* 分析页：记录选择器（自定义下拉） */
.rec-select-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.rec-select-row .sel-label{font-size:12px;color:var(--text-faint);letter-spacing:1px;flex-shrink:0}
.dropdown{position:relative}
.dd-trigger{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  color:var(--text);border-radius:12px;padding:9px 14px;font-size:13px;cursor:pointer;
  min-height:42px;min-width:240px;max-width:100%;transition:border-color .2s,background .2s;
  -webkit-tap-highlight-color:transparent;
}
.dd-trigger:hover{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.07)}
.dropdown.open .dd-trigger{border-color:rgba(255,107,91,0.5);background:rgba(255,107,91,0.08)}
.dd-trigger .dd-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.dd-trigger .dd-sub{font-size:11px;color:var(--text-faint);white-space:nowrap;flex-shrink:0;margin-left:auto}
.dd-caret{width:12px;height:12px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.55;transition:transform .25s}
.dropdown.open .dd-caret{transform:rotate(180deg);opacity:.9}
.dd-menu{
  position:absolute;top:calc(100% + 6px);left:0;z-index:40;
  min-width:100%;max-height:250px;overflow-y:auto;
  background:#1d212b;border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:6px;box-shadow:0 18px 44px rgba(0,0,0,0.55);
  opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;
  transition:opacity .18s ease,transform .18s cubic-bezier(.22,.61,.36,1);
}
.dropdown.open .dd-menu{opacity:1;transform:none;pointer-events:auto}
.dd-item{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:none;color:var(--text-dim);text-align:left;
  padding:9px 10px;border-radius:9px;font-size:13px;cursor:pointer;
  transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;
}
.dd-item:hover{background:rgba(255,255,255,0.07);color:var(--text)}
.dd-item.on{color:var(--accent);background:rgba(255,107,91,0.12)}
.dd-item .dd-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-item .dd-sub{font-size:11px;color:var(--text-faint);flex-shrink:0}
.dd-item.on .dd-sub{color:rgba(255,107,91,0.7)}
.dd-check{width:14px;height:14px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 分析页：按科目分组雷达卡片 */
.radar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:10px}
.radar-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:14px 12px 10px;min-width:0}
.radar-card-title{font-size:12.5px;color:var(--text-dim);text-align:center;letter-spacing:1.5px;margin-bottom:4px;font-weight:600}
.radar-svg{width:100%;height:auto;display:block}
.radar-empty{font-size:12px;color:var(--text-faint);text-align:center;padding:36px 0}
.radar-caption{font-size:12px;color:var(--text-faint);margin-top:8px}

.breakdown-list{margin-top:8px;display:flex;flex-direction:column;gap:10px}
.breakdown-group{
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.05);
  border-radius:14px;padding:10px 14px 6px;
}
.breakdown-group .g-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:14px;font-weight:600;padding-bottom:4px;
}
.breakdown-group .g-head .g-score{
  font-size:13px;font-weight:500;color:var(--text-dim);font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.breakdown-item{
  display:grid;grid-template-columns:minmax(0,1fr) 56px 40px;gap:10px;align-items:center;
  padding:7px 0;font-size:12px;border-top:1px solid rgba(255,255,255,0.04);
}
.breakdown-item .n{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.breakdown-item .n em{font-style:normal;font-size:11px;color:var(--text-faint);margin-left:5px;font-variant-numeric:tabular-nums}
.breakdown-item .bar{display:block;height:5px;border-radius:5px;background:rgba(255,255,255,0.07);position:relative;overflow:hidden}
.breakdown-item .bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#ff6b5b,#ffb199)}
.breakdown-item .m{text-align:right;font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums}

/* ============ 屏幕切换（Dock 驱动） ============ */
/* 顺序过渡：旧卡片原位淡出（仍在文档流中，避免高度跳变）→ 新卡片自下淡入 */
.screen{display:none}
.screen.active{display:block;animation:screenIn .4s cubic-bezier(.22,1,.36,1) both}
@keyframes screenIn{
  from{opacity:0;transform:translateY(18px) scale(.985)}
  to{opacity:1;transform:none}
}
.screen.leaving{display:block;animation:screenOut .22s ease both;pointer-events:none}
@keyframes screenOut{
  from{opacity:1;transform:none}
  to{opacity:0;transform:translateY(-12px) scale(.99)}
}

/* ============ 底部 Dock 栏 ============ */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:center;gap:10px;
  padding:9px 16px calc(9px + env(safe-area-inset-bottom));
  background:rgba(15,17,21,.86);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  backdrop-filter:blur(20px) saturate(140%);
  border-top:1px solid rgba(255,255,255,.07);
  box-shadow:0 -12px 30px rgba(0,0,0,.35);
}
.dock-item{
  position:relative;z-index:1;flex:1 1 0;max-width:180px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:9px 6px 8px;border:none;background:transparent;cursor:pointer;
  color:var(--text-faint);font-family:inherit;
  border-radius:16px;-webkit-tap-highlight-color:transparent;
  transition:color .28s ease,transform .28s cubic-bezier(.22,1,.36,1);
}
.dock-item:hover{color:var(--text-dim)}
.dock-item:active{transform:scale(.94)}
.dock-item .dock-icon{
  display:block;width:24px;height:24px;
  transition:transform .38s cubic-bezier(.34,1.56,.64,1),color .28s ease;
}
.dock-item .dock-icon svg{width:100%;height:100%;display:block}
.dock-item .dock-label{font-size:11px;letter-spacing:.5px;line-height:1;transition:font-weight .2s}
.dock-item.active{color:var(--text)}
.dock-item.active .dock-icon{color:var(--accent);transform:translateY(-3px) scale(1.1)}
.dock-item.active .dock-label{font-weight:600}
/* 选中项高亮胶囊：滑动过渡，位于文字之下、Dock 背景之上 */
.dock-pill{
  position:absolute;top:6px;bottom:6px;z-index:0;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,107,91,.18),rgba(255,107,91,.06));
  border:1px solid rgba(255,107,91,.3);
  transition:left .42s cubic-bezier(.22,1,.36,1),width .42s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
}

/* ============ 抽屉 ============ */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s ease}
.sheet-mask.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:#1a1e27;
  border-radius:24px 24px 0 0;border:1px solid var(--card-stroke);
  padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .38s cubic-bezier(.22,1,.36,1);
  max-width:860px;margin:0 auto;max-height:85vh;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet h3{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 .x{cursor:pointer;color:var(--text-faint);font-size:20px;line-height:1;padding:4px}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:6px;letter-spacing:.5px}
.field input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;transition:border .2s;-webkit-appearance:none;appearance:none;color-scheme:dark}
.field input:focus{border-color:var(--accent)}
.field-row{display:flex;gap:10px;flex-wrap:wrap}
.field-row .field{flex:1;min-width:140px}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1;justify-content:center}

/* ============ 确认对话框（替代原生 confirm/alert） ============ */
.confirm-mask{
  position:fixed;inset:0;z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.confirm-mask.open{opacity:1;pointer-events:auto}
.confirm-box{
  width:100%;max-width:340px;background:#1a1e27;
  border:1px solid var(--card-stroke);border-radius:20px;
  padding:22px 20px 18px;box-shadow:0 24px 60px rgba(0,0,0,.5);
  transform:translateY(14px) scale(.96);opacity:0;
  transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .25s ease;
}
.confirm-mask.open .confirm-box{transform:none;opacity:1}
.confirm-box .c-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:1px}
.confirm-box .c-ic{
  width:30px;height:30px;border-radius:10px;flex-shrink:0;
  background:rgba(255,107,91,.14);border:1px solid rgba(255,107,91,.35);
  display:grid;place-items:center;color:var(--accent);
}
.confirm-box .c-ic svg{width:15px;height:15px;display:block}
.confirm-box .c-msg{margin-top:12px;font-size:13px;color:var(--text-dim);line-height:1.7;word-break:break-all}
.confirm-box .c-hint{margin-top:6px;font-size:11px;color:var(--text-faint)}
.confirm-box .c-acts{display:flex;gap:10px;margin-top:20px}
.confirm-box .c-acts .btn{flex:1;justify-content:center}
.btn.destructive{background:rgba(255,107,91,.14);border-color:rgba(255,107,91,.45);color:var(--accent)}
.btn.destructive:hover{background:rgba(255,107,91,.24);border-color:var(--accent)}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-logo" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 64 64" fill="none">
        <g transform="rotate(-60 32 32)">
          <circle cx="32" cy="32" r="20" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="101 25"/>
        </g>
        <polyline points="21,37.5 29,30.5 37,35 44,26" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">研心</div>
    </div>
  </div>
</header>

<!-- ========== 倒计时卡片 ========== -->
<main class="card screen active" id="cdCard" data-screen="countdown">
  <div class="card-inner" id="cardInner">
    <div class="cd-side">
      <div class="cd-target"><span class="dot"></span><span id="targetLabel">距离考研还有</span></div>
      <div class="cd" id="cd" aria-live="polite">
        <span class="num" id="days">00</span><span class="unit">天</span>
        <span class="sub" id="hm">00 : 00</span>
      </div>
      <div class="cd-progress"><i id="bar"></i></div>
      <div id="doneMsg" style="display:none" class="done">🎉 目标已到达，加油冲刺！</div>
    </div>
    <div class="ctrl-side">
      <div class="actions">
        <button class="btn primary" id="customBtn"><span class="ic">✎</span>自定义时间</button>
        <button class="btn" id="resetBtn"><span class="ic">↺</span>默认考试日</button>
      </div>
    </div>
  </div>
</main>

<!-- ========== 成绩分析卡片 ========== -->
<main class="card screen" id="scoreCard" data-screen="score">
  <div class="card-header">
    <div class="sub-nav">
      <button class="tab active" data-tab="input">录入</button>
      <button class="tab" data-tab="analyze">分析</button>
      <button class="tab" data-tab="subjects">科目</button>
    </div>
  </div>

  <section id="view-input" class="card-inner view">
    <div id="inputArea"></div>
    <div id="inputEmpty" class="empty-tip">尚未选择考试科目 · 请先到「科目」Tab 选择</div>
    <div id="recordsWrap" class="records-wrap" style="display:none">
      <div class="section-label" style="margin-top:0">已保存记录</div>
      <div id="recordList"></div>
    </div>
  </section>

  <section id="view-analyze" class="card-inner view" style="display:none">
    <div id="analyzeArea"></div>
    <div id="analyzeEmpty" class="empty-tip">暂无成绩数据 · 请先录入</div>
  </section>

  <section id="view-subjects" class="card-inner view" style="display:none">
    <div style="font-size:14px;color:var(--text-dim);margin-bottom:4px">选择你的考试科目</div>
    <div class="subject-grid" id="subjectGrid"></div>
    <div class="sub-select" id="subSelectWrap"></div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn primary" id="saveSubjectsBtn"><span class="ic">✓</span>保存科目</button>
      <button class="btn ghost" id="clearSubjectsBtn">清空</button>
    </div>
  </section>
</main>

<!-- ========== 底部 Dock 栏 ========== -->
<nav class="dock" id="dock" role="tablist" aria-label="主导航">
  <span class="dock-pill" id="dockPill" aria-hidden="true"></span>
  <button class="dock-item active" type="button" role="tab" aria-selected="true" data-screen="countdown">
    <span class="dock-icon" aria-hidden="true">
      <!-- 沙漏：上半沙漏 + 下半沙漏，表达时间流逝 -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5.5 2.5h13"/>
        <path d="M5.5 21.5h13"/>
        <path d="M7 2.5v4.2c0 1.9 1.2 3.5 2.9 4.1l2.1.8-2.1.8C8.2 13 7 14.6 7 16.5v4.2"/>
        <path d="M17 2.5v4.2c0 1.9-1.2 3.5-2.9 4.1l-2.1.8 2.1.8c1.7.6 2.9 2.2 2.9 4.1v4.2"/>
        <path d="M9.6 18.6c.7-.9 1.5-1.4 2.4-1.4s1.7.5 2.4 1.4"/>
      </svg>
    </span>
    <span class="dock-label">倒计时</span>
  </button>
  <button class="dock-item" type="button" role="tab" aria-selected="false" data-screen="score">
    <span class="dock-icon" aria-hidden="true">
      <!-- 柱状图 + 上升趋势线，表达成绩分析 -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 20.5h17"/>
        <path d="M7 20.5v-5.2"/>
        <path d="M12 20.5V8.4"/>
        <path d="M17 20.5v-8.1"/>
        <path d="M6.4 11.6 11 7.4l3.3 2.6 4.6-4.4"/>
        <path d="M16.4 5.6H19v2.6"/>
      </svg>
    </span>
    <span class="dock-label">成绩分析</span>
  </button>
</nav>

<!-- 日期抽屉 -->
<div class="sheet-mask" id="mask"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <h3><span>自定义倒计时目标</span><span class="x" id="sheetX">×</span></h3>
  <div class="field-row">
    <div class="field"><label for="fDate">目标日期</label><input type="date" id="fDate"/></div>
    <div class="field"><label for="fTime">开始时间</label><input type="time" id="fTime" value="09:00"/></div>
  </div>
  <div class="field"><label>考试名称（可选）</label><input type="text" id="fName" placeholder="例：2027 考研初试" maxlength="20"/></div>
  <div class="field"><label>起始日期（用于计算「已坚持」）</label><input type="date" id="fStart"/></div>
  <div class="sheet-actions">
    <button class="btn ghost" id="cancelBtn">取消</button>
    <button class="btn primary" id="saveBtn">保存</button>
  </div>
</section>

<!-- 确认对话框（删除记录 / 错误提示） -->
<div class="confirm-mask" id="confirmMask" role="alertdialog" aria-modal="true" aria-labelledby="cTitleText" aria-describedby="cMsg">
  <div class="confirm-box">
    <div class="c-title">
      <span class="c-ic" id="cIcon" aria-hidden="true"></span>
      <span id="cTitleText">删除成绩记录</span>
    </div>
    <div class="c-msg" id="cMsg"></div>
    <div class="c-hint" id="cHint">该操作无法撤销</div>
    <div class="c-acts">
      <button class="btn ghost" type="button" id="cCancel">取消</button>
      <button class="btn destructive" type="button" id="cOk">删除</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const LS_CD='yanxin.cd.v1', LS_SUBJ='yanxin.subjects.v1', LS_SCORE='yanxin.scores.v1';

  /* =============== 题型分值数据 =============== */
  const SUBJECTS={
    politics:{name:'政治',full:100,parts:[
      {k:'dk',label:'单选题（1-16）',full:16},
      {k:'ms',label:'多选题（17-33）',full:34},
      {k:'fx34',label:'分析题34·马原',full:10},
      {k:'fx35',label:'分析题35·毛中特',full:10},
      {k:'fx36',label:'分析题36·史纲',full:10},
      {k:'fx37',label:'分析题37·思修法基',full:10},
      {k:'fx38',label:'分析题38·形策当代',full:10}
    ]},
    english1:{name:'英语（一）',full:100,parts:[
      {k:'wxk',label:'完形填空（20题）',full:10},
      {k:'yiduhua',label:'阅读A（20题）',full:40},
      {k:'xin',label:'新题型B（5题）',full:10},
      {k:'fanyi',label:'翻译（5题）',full:10},
      {k:'xiezuoyit',label:'小作文',full:10},
      {k:'xiezuoer',label:'大作文',full:20}
    ]},
    english2:{name:'英语（二）',full:100,parts:[
      {k:'wxk',label:'完形填空（20题）',full:10},
      {k:'yiduhua',label:'阅读A（20题）',full:40},
      {k:'xin',label:'新题型B（5题）',full:10},
      {k:'fanyi',label:'翻译',full:15},
      {k:'xiezuoyit',label:'小作文',full:10},
      {k:'xiezuoer',label:'大作文',full:15}
    ]},
    math1:{name:'数学（一）',full:150,parts:[
      {k:'xzt',label:'选择题（10题）',full:50},
      {k:'tkt',label:'填空题（6题）',full:30},
      {k:'jjt',label:'解答题',full:70}
    ]},
    math2:{name:'数学（二）',full:150,parts:[
      {k:'xzt',label:'选择题（10题）',full:50},
      {k:'tkt',label:'填空题（6题）',full:30},
      {k:'jjt',label:'解答题',full:70}
    ]},
    math3:{name:'数学（三）',full:150,parts:[
      {k:'xzt',label:'选择题（10题）',full:50},
      {k:'tkt',label:'填空题（6题）',full:30},
      {k:'jjt',label:'解答题',full:70}
    ]},
    mathnong:{name:'数学（农）',full:150,parts:null},
    mathzzy:{name:'自命题理学数学',full:150,parts:null},
    p408:{name:'408 计算机',full:150,parts:[
      {k:'xzt',label:'选择题（40题）',full:80},
      {k:'zhyyt',label:'综合应用题',full:70}
    ]},
    p396:{name:'396 经济类综合',full:150,parts:null},
    p306:{name:'306 西医综合',full:300,parts:null},
    p307:{name:'307 中医综合',full:300,parts:null},
    pCustom:{name:'自定义专业课',full:150,parts:null,customName:true}
  };

  const GROUPS=[
    {label:'政治',keys:['politics']},
    {label:'英语',keys:['english1','english2']},
    {label:'数学',keys:['math1','math2','math3','mathnong','mathzzy']},
    {label:'专业课',keys:['p408','p396','p306','p307','pCustom']}
  ];

  /* =============== 工具 =============== */
  function loadJson(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
  function saveJson(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  const pad=n=>String(n).padStart(2,'0');
  function flash(btn,txt){const old=btn.innerHTML;btn.innerHTML=txt;btn.disabled=true;setTimeout(()=>{btn.innerHTML=old;btn.disabled=false},1200)}

  /* =============== 倒计时 =============== */
  function defaultExamDate(){const n=new Date();let y=n.getFullYear();let d=new Date(y,11,20,9,0,0);if(d<=n)d=new Date(y+1,11,20,9,0,0);return d}
  function defaultStartDate(){return new Date(new Date().getFullYear(),2,1,0,0,0)}
  const defaultTarget=defaultExamDate(),defaultStart=defaultStartDate();
  /* 方向决策：电脑端强制横版 row 布局，手机端默认竖版 column（手机横屏时切横版） */
  function isPhone(){return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)}
  function suggestLandscape(){
    if(!isPhone())return true;                  // 电脑端：始终横版
    const w=window.innerWidth,h=window.innerHeight;
    return w>=760||w/h>=1.15;                   // 手机端：竖屏竖版，横屏横版
  }
  /* 科目网格等全局版式仍按视口宽高决定窄/宽渲染 */
  function suggestGridLayout(){
    const w=window.innerWidth,h=window.innerHeight;
    return w>=760&&w/h>=1.15;
  }

  // 每次启动都按当前视口重新计算方向：电脑端默认横屏，手机端默认竖屏。
  // 旧版本存的 portrait/target_time 字段一律丢弃，避免残留状态把布局钉死。
  let rawCd=loadJson(LS_CD);
  let cdState=(rawCd&&rawCd.target)
    ? {target:rawCd.target,start:rawCd.start,name:rawCd.name}
    : {target:defaultTarget.getTime(),start:defaultStart.getTime(),name:'2027 考研初试'};
  if(cdState.target<=cdState.start)cdState.target=defaultTarget.getTime();
  cdState.landscape=suggestLandscape();         // 按设备决定：电脑横版 / 手机竖版

  function renderCd(){
    const now=Date.now();let diff=cdState.target-now;
    const reached=diff<=0;diff=Math.max(0,diff);
    const s=Math.floor(diff/1000);
    const days=Math.floor(s/86400),hrs=Math.floor((s%86400)/3600),min=Math.floor((s%3600)/60);
    $('days').textContent=pad(days);
    $('hm').textContent=pad(hrs)+' : '+pad(min);
    $('targetLabel').textContent='距离考研还有';
    const totalMs=cdState.target-cdState.start;
    const pct=totalMs>0?Math.min(100,Math.max(0,(now-cdState.start)/totalMs*100)):100;
    $('bar').style.width=pct+'%';
    $('doneMsg').style.display=reached?'block':'none';
    $('cd').style.opacity=reached?'.35':'1';
  }

  /* 应用方向：landscape=true → row 横版；false → column 竖版 */
  function applyCdMode(){
    const card=$('cdCard');
    card.classList.toggle('layout-landscape',!!cdState.landscape);
  }
  /* 全局版式：跟随视口，决定科目网格等窄/宽版渲染，
     使「电脑竖屏」与「手机竖屏」得到一致界面 */
  function applyLayoutMode(){
    const wide=suggestGridLayout();
    document.body.classList.toggle('mode-landscape',wide);
    document.body.classList.toggle('mode-portrait',!wide);
  }

  // 跟随系统方向 + 窗口 resize（电脑端恒横版；手机端随旋转切换横竖版）
  if('screen'in window&&screen.orientation&&screen.orientation.addEventListener){
    screen.orientation.addEventListener('change',()=>{
      applyLayoutMode();
      cdState.landscape=suggestLandscape();
      applyCdMode();
    });
  }
  window.addEventListener('orientationchange',()=>{
    applyLayoutMode();
    cdState.landscape=suggestLandscape();
    applyCdMode();
  });
  let _rzTimer;
  window.addEventListener('resize',()=>{
    clearTimeout(_rzTimer);
    _rzTimer=setTimeout(()=>{
      applyLayoutMode();                 // 全局版式始终跟随视口
      const now=suggestLandscape();      // 倒计时方向：电脑恒横版，手机随视口切换
      if(now!==cdState.landscape){
        cdState.landscape=now;
        applyCdMode();
      }
    },150);
  });

  /* 抽屉 */
  const mask=$('mask'),sheet=$('sheet');
  function openSheet(){
    const t=new Date(cdState.target);
    $('fDate').valueAsDate=t;
    $('fTime').value=pad(t.getHours())+':'+pad(t.getMinutes());
    $('fName').value=cdState.name||'';
    $('fStart').valueAsDate=new Date(cdState.start);
    mask.classList.add('open');sheet.classList.add('open');
  }

  $('resetBtn').addEventListener('click',()=>{

    saveJson(LS_CD,cdState);renderCd();
  });

  /* =============== 科目选择 =============== */
  let subjectSel=loadJson(LS_SUBJ)||null;
  function getSelKey(group){return subjectSel&&subjectSel.selected?subjectSel.selected[group]:null}

  function renderSubjects(){
    const grid=$('subjectGrid');grid.innerHTML='';
    GROUPS.forEach(g=>{
      const wrap=document.createElement('div');
      wrap.innerHTML='<div class="sg-group-label">'+g.label+'</div>';

          document.querySelectorAll('.subject-card').forEach(c=>{if(c.dataset.group===g.label)c.classList.remove('selected')});
          el.classList.add('selected');

            refreshInput();

          }

  function renderSubSelect(){
    const wrap=$('subSelectWrap');wrap.innerHTML='';

  }
  $('saveSubjectsBtn').addEventListener('click',()=>{
    saveJson(LS_SUBJ,subjectSel);refreshInput();
    flash($('saveSubjectsBtn'),'已保存 ✓');

  $('clearSubjectsBtn').addEventListener('click',()=>{
    subjectSel=null;saveJson(LS_SUBJ,null);renderSubjects();refreshInput();
  });

  /* =============== 录入视图 =============== */
  let editingId=null;      // 正在编辑的记录 id（null=新记录）
  let autoTimer=null;      // 自动保存防抖计时
  function activeKeys(){
    const arr=[];
    GROUPS.forEach(g=>{
      const k=getSelKey(g.label);
      if(!k)return;
      if(k==='pCustom'){
        arr.push({key:'pCustom',name:(subjectSel&&subjectSel.customName)?subjectSel.customName:'自定义专业课'});
        return;
      }
      arr.push({key:k,name:SUBJECTS[k].name});
    });
    return arr;
  }
  function refreshInput(){
    const area=$('inputArea');
    const hasSubjects=subjectSel&&subjectSel.selected&&Object.keys(subjectSel.selected).some(g=>subjectSel.selected[g]);
    if(!hasSubjects){area.innerHTML='';$('inputEmpty').style.display='block';return}
    $('inputEmpty').style.display='none';
    const keys=activeKeys();
    if(!keys.length){area.innerHTML='';$('inputEmpty').style.display='block';return}

    area.innerHTML='';
    const top=document.createElement('div');top.className='input-top';
    top.innerHTML=
      '<div class="field"><label>录入时间</label><input type="date" id="scoreTime" value="'+new Date().toISOString().slice(0,10)+'"/></div>'+
      '<div class="field"><label>录入内容</label><input type="text" id="recTitle" placeholder="例如：2026年考研真题" maxlength="30"/></div>';
    area.appendChild(top);
    top.querySelector('#recTitle').addEventListener('input',scheduleAutoSave);

    keys.forEach(({key})=>{
      const s=SUBJECTS[key];
      const sec=document.createElement('div');sec.className='section-block';sec.dataset.key=key;
      const head=document.createElement('h4');
      head.innerHTML='<span>'+s.name+'</span>'+
        '<span class="h4-right"><button type="button" class="calc-btn">计算总分</button>'+
        '<span class="full">满分 '+s.full+'</span></span>';
      sec.appendChild(head);
      head.querySelector('.calc-btn').addEventListener('click',()=>{
        if(!s.parts){
          setStatusMsg('「'+s.name+'」无分项 · 请直接填写总分');return;
        }
        if(recalcTotal(sec)){setStatusMsg('「'+s.name+'」总分已计算 ✓');scheduleAutoSave()}
        else setStatusMsg('「'+s.name+'」分项未填齐 · 请补全后再计算',true);
      });
      // 总分行（高亮）
      const totalRow=document.createElement('div');totalRow.className='score-row';totalRow.dataset.part='total';totalRow.dataset.prefix=key;totalRow.dataset.full=s.full;
      totalRow.style.cssText='background:var(--accent-soft);border-radius:10px;padding:8px;margin:4px -8px 6px';
      totalRow.innerHTML=
        '<div class="lbl" style="font-weight:600;color:var(--text)">'+s.name+' 总分</div>'+
        '<input type="number" min="0" max="'+s.full+'" step="0.5" placeholder="0" />'+
        '<div class="full-lbl">满分 '+s.full+'</div>';
      sec.appendChild(totalRow);
      // 各部分
      if(s.parts){
        s.parts.forEach(p=>{
          const row=document.createElement('div');row.className='score-row';row.dataset.part=p.k;row.dataset.prefix=key;row.dataset.full=p.full;
          row.innerHTML=
            '<div class="lbl">'+p.label+'</div>'+
            '<input type="number" min="0" max="'+p.full+'" step="0.5" placeholder="0" />'+
            '<div class="full-lbl">满分 '+p.full+'</div>';
          sec.appendChild(row);
        });
      }
      area.appendChild(sec);
    });
    buildGrandBlock(area,keys);   // 四科之后插入「考试总分」区块

    const actions=document.createElement('div');actions.className='input-actions';actions.id='inputActions';
    area.appendChild(actions);
    updateActions();
    const status=document.createElement('div');status.className='auto-status';status.id='autoStatus';
    status.textContent=editingId!=null?'正在编辑已有记录 · 修改后自动保存':'录入后自动保存，无需手动点击';
    area.appendChild(status);
    bindScoreInputs();
    renderRecords();
  }
  /* 按钮区独立重建：保存/更新 + 编辑态下的「新增记录」 */
  function updateActions(){
    const actions=$('inputActions');if(!actions)return;
    actions.innerHTML='';
    const save=document.createElement('button');save.className='btn primary';
    save.innerHTML='<span class="ic">✓</span>'+(editingId!=null?'更新成绩':'保存成绩');
    save.addEventListener('click',()=>persistScores(true));
    actions.appendChild(save);
    if(editingId!=null){
      const fresh=document.createElement('button');fresh.className='btn ghost';
      fresh.innerHTML='新增记录';
      fresh.addEventListener('click',()=>{editingId=null;refreshInput()});
      actions.appendChild(fresh);
    }
  }
  function bindScoreInputs(){
    document.querySelectorAll('#inputArea .section-block[data-key]').forEach(sec=>{
      sec.querySelectorAll('.score-row').forEach(row=>{
        const inp=row.querySelector('input');
        const full=parseFloat(row.dataset.full);
        inp.addEventListener('input',()=>{
          let v=inp.value===''?'':parseFloat(inp.value);
          if(v<0){inp.value='0';v=0}
          if(v>full){inp.value=String(full);v=full}
          // 实时求和：分项填齐后自动写入总分（与「计算总分」按钮并存）
          if(row.dataset.part!=='total'){
            if(!recalcTotal(sec)){
              const t=sec.querySelector('.score-row[data-part="total"] input');
              if(t)t.value='';
            }
          }
          scheduleAutoSave();
        });
      });
    });
  }
  /* 各部分分数 → 总分求和；返回是否计算成功（分项未填齐返回 false） */
  function recalcTotal(sec){
    const rows=[...sec.querySelectorAll('.score-row:not([data-part="total"]) input')];
    if(!rows.length)return false;
    const totalInp=sec.querySelector('.score-row[data-part="total"] input');
    if(!totalInp)return false;
    const vals=rows.map(i=>i.value);
    if(vals.some(x=>x===''))return false;                 // 分项未填齐
    const sum=vals.reduce((a,b)=>a+parseFloat(b),0);
    const max=parseFloat(sec.querySelector('.score-row[data-part="total"]').dataset.full);
    totalInp.value=String(Math.min(sum,max));
    return true;
  }
  function setStatusMsg(txt,bad){
    const st=$('autoStatus');if(!st)return;
    st.textContent=txt;st.classList.toggle('bad',!!bad);
  }

  /* 考试总分 = 各科总分之和（在四科区块之后插入） */
  function buildGrandBlock(area,keys){
    const fullSum=keys.reduce((a,{key})=>a+SUBJECTS[key].full,0);
    const g=document.createElement('div');
    g.className='section-block grand-block';g.id='grandBlock';
    g.innerHTML=
      '<h4><span>考试总分</span>'+
      '<span class="h4-right"><button type="button" class="calc-btn" id="calcGrandBtn">计算总分</button>'+
      '<span class="full">满分 '+fullSum+'</span></span></h4>'+
      '<div class="score-row" data-part="grand" data-full="'+fullSum+'" style="background:var(--accent-soft);border-radius:10px;padding:8px;margin:4px -8px 0">'+
      '<div class="lbl" style="font-weight:600;color:var(--text)">四门总成绩</div>'+
      '<input type="number" id="grandTotal" min="0" max="'+fullSum+'" step="0.5" placeholder="0"/>'+
      '<div class="full-lbl">满分 '+fullSum+'</div></div>';
    area.appendChild(g);
    g.querySelector('#calcGrandBtn').addEventListener('click',()=>{
      const secs=[...document.querySelectorAll('#inputArea .section-block[data-key]')];
      let sum=0,all=true;
      secs.forEach(sec=>{
        const t=sec.querySelector('.score-row[data-part="total"] input');
        if(!t||t.value===''){all=false;return}
        sum+=parseFloat(t.value);
      });
      if(!all||!secs.length){setStatusMsg('请先填写所有科目的总分，再计算考试总分',true);return}
      const gi=$('grandTotal');
      gi.value=String(Math.min(sum,fullSum));
      setStatusMsg('考试总分已计算 ✓ 共 '+secs.length+' 科');
      scheduleAutoSave();
    });
    const gi=g.querySelector('#grandTotal');
    gi.addEventListener('input',()=>{
      let v=gi.value===''?'':parseFloat(gi.value);
      if(v<0){gi.value='0'}
      if(v>fullSum){gi.value=String(fullSum)}
      scheduleAutoSave();
    });
  }

  /* =============== 自动保存（防抖） =============== */
  function scheduleAutoSave(){
    const st=$('autoStatus');
    if(st&&!st.classList.contains('bad'))st.textContent='录入中…';
    clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>persistScores(false),700);
  }

  function collectScores(){
    const records=[];let err=null;
    document.querySelectorAll('#inputArea .section-block[data-key]').forEach(sec=>{
      const keyBase=sec.dataset.key;
      const totalEl=sec.querySelector('.score-row[data-part="total"] input');
      const total=totalEl?totalEl.value:'';
      sec.style.outline='none';
      const parts={};
      sec.querySelectorAll('.score-row:not([data-part="total"])').forEach(r=>{
        const v=r.querySelector('input').value;
        if(v!=='')parts[r.dataset.part]=parseFloat(v);
      });
      // 该科完全未填 → 跳过（允许只填部分科目）
      if(total===''&&!Object.keys(parts).length)return;
      // 分项未填齐 → 总分暂空，静默跳过该科（不视为错误）
      if(total==='')return;
      let sum=0;Object.values(parts).forEach(x=>sum+=x);
      if(Object.keys(parts).length&&Math.abs(sum-parseFloat(total))>0.01){
        sec.style.outline='2px solid var(--warn)';
        err=err||'「'+SUBJECTS[keyBase].name+'」各部分之和 '+sum+' ≠ 总分 '+total;
        return;
      }
      records.push({subject:keyBase,name:(keyBase==='pCustom'?((subjectSel&&subjectSel.customName)||'自定义专业课'):SUBJECTS[keyBase].name),full:SUBJECTS[keyBase].full,total:parseFloat(total),parts});
    });
    return {records,err};
  }

  function persistScores(explicit){
    clearTimeout(autoTimer);
    const {records,err}=collectScores();
    const st=$('autoStatus');
    if(err){
      if(st){st.textContent='⚠ '+err;st.classList.add('bad')}
      if(explicit)confirmDialog({title:'无法保存',msg:err,okText:'知道了',single:true,warn:true});
      return;
    }
    if(!records.length){
      if(explicit)confirmDialog({title:'无法保存',msg:'请至少填写一个科目的成绩',okText:'知道了',single:true,warn:true});
      else if(st){st.textContent='录入中…';st.classList.remove('bad')}
      return;
    }
    const time=($('scoreTime')&&$('scoreTime').value)||new Date().toISOString().slice(0,10);
    const title=(($('recTitle')&&$('recTitle').value)||'').trim();
    const gi=$('grandTotal');
    const grand=(gi&&gi.value!=='')?parseFloat(gi.value):null;
    const arr=loadJson(LS_SCORE)||[];
    if(editingId!=null){
      const i=arr.findIndex(r=>r.id===editingId);
      if(i>=0){arr[i].time=time;arr[i].title=title;arr[i].grand=grand;arr[i].records=records}
      else{editingId=null}
    }
    if(editingId==null){
      editingId=Date.now()+Math.floor(Math.random()*1000);
      arr.push({id:editingId,time,title,grand,records});
    }
    saveJson(LS_SCORE,arr);
    if(st){
      const d=new Date();
      st.textContent='✓ 已自动保存 '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
      st.classList.remove('bad');
    }
    renderRecords();analyzeId=editingId;renderAnalyze();
    updateActions();                          // 编辑态下按钮变为「更新成绩/新增记录」
    if(explicit&&st){st.textContent='✓ 已保存 '+time;st.classList.remove('bad')}
  }

  /* =============== 确认对话框（替代原生 confirm/alert） =============== */
  const IC_TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
  const IC_WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v5"/><path d="M12 17.4v.2"/></svg>';
  function confirmDialog(opt){
    return new Promise(resolve=>{
      const mask=$('confirmMask'),okBtn=$('cOk'),cancelBtn=$('cCancel');
      const single=!!opt.single;                       // 单按钮模式（提示类，仅「知道了」）
      $('cTitleText').textContent=opt.title||'提示';
      $('cMsg').textContent=opt.msg||'';
      $('cHint').textContent=opt.hint||'';
      $('cHint').style.display=opt.hint?'block':'none';
      $('cIcon').innerHTML=opt.warn?IC_WARN:IC_TRASH;
      okBtn.textContent=opt.okText||'删除';
      cancelBtn.textContent=opt.cancelText||'取消';
      cancelBtn.style.display=single?'none':'';
      let closed=false;
      const close=v=>{
        if(closed)return;closed=true;
        mask.classList.remove('open');
        document.removeEventListener('keydown',onKey);
        resolve(v);
      };
      const onKey=e=>{
        if(e.key==='Escape')close(false);
        else if(e.key==='Enter')close(true);
      };
      okBtn.onclick=()=>close(true);
      cancelBtn.onclick=()=>close(false);
      mask.onclick=e=>{if(e.target===mask)close(false)};
      document.addEventListener('keydown',onKey);
      mask.classList.add('open');
      (single?okBtn:cancelBtn).focus();
    });
  }

  /* =============== 记录列表（查看/编辑/删除） =============== */
  function renderRecords(){
    const wrap=$('recordsWrap'),list=$('recordList');
    const arr=loadJson(LS_SCORE)||[];
    if(!arr.length){wrap.style.display='none';list.innerHTML='';return}
    wrap.style.display='block';
    list.innerHTML=arr.slice().reverse().map(r=>{
      const sum=Math.round(r.records.reduce((s,x)=>s+x.total,0)*100)/100;
      const score=(r.grand!=null)?r.grand:sum;          // 有考试总分优先展示
      const title=r.title||'成绩记录';
      return '<div class="rec-item'+(r.id===editingId?' on':'')+'" data-id="'+r.id+'">'+
        '<div class="rec-score"><b>'+score+'</b></div>'+
        '<div class="rec-info">'+
        '<span class="rec-time">'+title+'<span class="rec-date">'+r.time+'</span></span>'+
        '</div>'+
        '<div class="rec-acts">'+
        '<button class="rec-btn" data-act="edit">编辑</button>'+
        '<button class="rec-btn danger" data-act="del">删除</button>'+
        '</div></div>';
    }).join('');
  }
  $('recordList').addEventListener('click',e=>{
    const btn=e.target.closest('.rec-btn');if(!btn)return;
    const id=Number(btn.closest('.rec-item').dataset.id);
    const arr=loadJson(LS_SCORE)||[];
    const rec=arr.find(r=>r.id===id);if(!rec)return;
    if(btn.dataset.act==='edit'){
      editingId=id;
      refreshInput();                       // 重建表单
      // 回填该记录数据
      const dateInp=$('scoreTime');if(dateInp)dateInp.value=rec.time;
      const titleInp=$('recTitle');if(titleInp)titleInp.value=rec.title||'';
      const gi=$('grandTotal');if(gi&&rec.grand!=null)gi.value=rec.grand;
      rec.records.forEach(r=>{
        const sec=document.querySelector('#inputArea .section-block[data-key="'+r.subject+'"]');
        if(!sec)return;
        const t=sec.querySelector('.score-row[data-part="total"] input');
        if(t)t.value=r.total;
        Object.keys(r.parts||{}).forEach(k=>{
          const row=sec.querySelector('.score-row[data-part="'+k+'"] input');
          if(row)row.value=r.parts[k];
        });
      });
      renderRecords();
      $('view-input').scrollIntoView({behavior:'smooth',block:'start'});
    }else{
      confirmDialog({
        title:'删除成绩记录',
        msg:'确定删除「'+(rec.title||rec.time)+'」这条成绩记录吗？',
        hint:'删除后无法恢复',
        okText:'删除'
      }).then(ok=>{
        if(!ok)return;
        const next=arr.filter(r=>r.id!==id);
        saveJson(LS_SCORE,next);
        if(editingId===id){editingId=null;refreshInput()}
        renderRecords();renderAnalyze();
      });
    }
  });

  /* =============== 分析视图 =============== */
  let analyzeId=null;                 // 分析页当前查看的记录 id（null=取最新）
  function renderAnalyze(){
    const arr=loadJson(LS_SCORE)||[];
    if(!arr.length){$('analyzeArea').innerHTML='';$('analyzeEmpty').style.display='block';analyzeId=null;return}
    if(analyzeId==null||!arr.some(r=>r.id===analyzeId))analyzeId=arr[arr.length-1].id;
    const rec=arr.find(r=>r.id===analyzeId);
    const area=$('analyzeArea');
    $('analyzeEmpty').style.display='none';
    const totalSum=rec.records.reduce((s,r)=>s+r.total,0);
    const fullSum=rec.records.reduce((s,r)=>s+r.full,0);
    const pct=Math.round(totalSum/fullSum*100);

    let html='';
    if(arr.length>1){
      const cur=rec;
      let items='';
      arr.forEach(r=>{
        const on=r.id===analyzeId;
        items+='<button type="button" class="dd-item'+(on?' on':'')+'" data-id="'+r.id+'">'+
          '<span class="dd-name">'+(r.title||'成绩记录')+'</span><span class="dd-sub">'+r.time+'</span>'+
          (on?'<svg class="dd-check" viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5L13 5"/></svg>':'')+'</button>';
      });
      html+='<div class="rec-select-row"><span class="sel-label">查看记录</span>'+
        '<div class="dropdown" id="analyzeDropdown">'+
        '<button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false">'+
          '<span class="dd-name">'+(cur.title||'成绩记录')+'</span><span class="dd-sub">'+cur.time+'</span>'+
          '<svg class="dd-caret" viewBox="0 0 16 16"><path d="M3 6l5 5 5-5"/></svg>'+
        '</button>'+
        '<div class="dd-menu" role="listbox">'+items+'</div>'+
        '</div></div>';
    }
    html+='<div class="analyze-hero">'+
      '<div class="total"><span class="v">'+totalSum+'</span><span class="l">总分 / '+fullSum+'</span></div>'+
      '<div class="meta">录入时间 '+rec.time+'<br>得分率 <b style="color:var(--text)">'+pct+'%</b></div>'+
    '</div>';

    html+='<div class="section-label">各科得分率</div>';
    html+='<div class="bar-chart" id="barChart">';
    rec.records.forEach(r=>{
      const p=Math.round(r.total/r.full*100);
      html+='<div class="col"><div class="bar" style="height:0%" data-h="'+p+'"><span class="val">'+r.total+'</span></div><div class="pct-label">'+p+'%</div><div class="name">'+r.name+'</div></div>';
    });
    html+='</div>';

    const groups=[];
    rec.records.forEach(r=>{
      if(!r.parts||!Object.keys(r.parts).length)return;
      const meta=SUBJECTS[r.subject];if(!meta||!meta.parts)return;
      const pts=meta.parts.filter(p=>r.parts[p.k]!=null).map(p=>({label:p.label,full:p.full,val:r.parts[p.k]}));
      if(pts.length)groups.push({name:r.name,pts:pts});
    });
    if(groups.length){
      html+='<div class="section-label">各部分得分率（雷达）</div><div class="radar-grid">';
      groups.forEach(g=>{
        html+='<div class="radar-card"><div class="radar-card-title">'+g.name+'</div>'+radarSvg(g.pts)+'</div>';
      });
      html+='</div><div class="radar-caption">虚线为满分 · 实线为实际得分率</div>';
    }

    html+='<div class="section-label">明细</div><div class="breakdown-list">';
    rec.records.forEach(r=>{
      html+='<div class="breakdown-group">'+
        '<div class="g-head"><span>'+r.name+'</span><span class="g-score">'+r.total+' / '+r.full+'</span></div>';
      if(r.parts&&Object.keys(r.parts).length){
        const meta=SUBJECTS[r.subject];
        (meta.parts||[]).forEach(p=>{
          const v=r.parts[p.k];if(v==null)return;
          const pp=Math.round(v/p.full*100);
          html+='<div class="breakdown-item">'+
            '<span class="n">'+p.label+'<em>'+v+' / '+p.full+'</em></span>'+
            '<span class="bar"><i style="width:'+pp+'%"></i></span>'+
            '<span class="m">'+pp+'%</span></div>';
        });
      }else{
        html+='<div class="breakdown-item"><span class="n">仅录入总分</span><span class="bar"><i style="width:0"></i></span><span class="m">—</span></div>';
      }
      html+='</div>';
    });
    html+='</div>';

    area.innerHTML=html;
    const dd=$('analyzeDropdown');
    if(dd){
      dd.querySelector('.dd-trigger').addEventListener('click',e=>{
        e.stopPropagation();
        const open=dd.classList.toggle('open');
        dd.querySelector('.dd-trigger').setAttribute('aria-expanded',open?'true':'false');
      });
      dd.querySelectorAll('.dd-item').forEach(it=>{
        it.addEventListener('click',()=>{analyzeId=+it.dataset.id;renderAnalyze()});
      });
    }
    requestAnimationFrame(()=>{
      document.querySelectorAll('#barChart .bar').forEach(b=>{b.style.height=b.dataset.h+'%'})
    });
  }
  function radarSvg(points){
    const n=points.length;
    if(n<3)return '<div class="radar-empty">分项不足 3 项，暂不生成雷达</div>';
    const fs=11;
    const textW=s=>{let w=0;for(const ch of s){w+=/[\u4e00-\u9fff（）·、：]/.test(ch)?fs:fs*0.58}return w};
    const maxW=Math.max(...points.map(p=>textW(p.label)));
    const side=maxW+26;                       // 左右标签预留空间
    const R=66,cx=side+R,cy=26+R;
    const W=cx+R+side,H=cy+R+26;
    const angle=i=>-Math.PI/2+i*2*Math.PI/n;
    function pt(i,frac){const a=angle(i);return [cx+R*frac*Math.cos(a),cy+R*frac*Math.sin(a)]}
    let grid='';
    for(let f=0.25;f<=1.001;f+=0.25){
      let d='';
      for(let i=0;i<n;i++){const p=pt(i,f);d+=(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '}
      d+='Z';grid+='<path d="'+d+'" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
    }
    /* 满分参考：最外圈虚线 */
    let full='';
    {let d='';for(let i=0;i<n;i++){const p=pt(i,1);d+=(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '}
    d+='Z';full='<path d="'+d+'" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 4"/>'}
    let axes='';
    for(let i=0;i<n;i++){const p=pt(i,1);axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>'}
    let labels='',dots='';
    for(let i=0;i<n;i++){
      const a=angle(i),ca=Math.cos(a);
      const lx=cx+(R+14)*Math.cos(a),ly=cy+(R+14)*Math.sin(a);
      const anchor=ca>0.3?'start':(ca<-0.3?'end':'middle');
      labels+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" fill="#9aa0aa" font-size="'+fs+'" text-anchor="'+anchor+'" dominant-baseline="middle">'+points[i].label+'</text>';
      const vp=pt(i,points[i].val/points[i].full);
      dots+='<circle cx="'+vp[0].toFixed(1)+'" cy="'+vp[1].toFixed(1)+'" r="2.5" fill="#ff6b5b"/>';
    }
    let poly='';
    for(let i=0;i<n;i++){const p=pt(i,Math.min(1,points[i].val/points[i].full));poly+=(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '}
    poly+='Z';
    return '<svg viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" xmlns="http://www.w3.org/2000/svg" class="radar-svg">'+
      '<g>'+grid+full+'</g><g>'+axes+'</g><g>'+labels+'</g>'+
      '<path d="'+poly+'" fill="rgba(255,107,91,0.22)" stroke="#ff6b5b" stroke-width="2" stroke-linejoin="round"/>'+
      '<g>'+dots+'</g>'+
      '</svg>';
  }

  /* =============== Tab 切换（淡入淡出 + 位移过渡） =============== */
  const views={input:$('view-input'),analyze:$('view-analyze'),subjects:$('view-subjects')};
  let curTab='input';
  function switchTab(name){
    if(!views[name])return;
    document.querySelectorAll('.sub-nav .tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
    if(name===curTab){ if(name==='analyze')renderAnalyze(); return; }
    const out=views[curTab], inn=views[name];
    curTab=name;
    if(out){
      out.style.transition='opacity .16s ease, transform .16s ease';
      out.style.opacity='0';
      out.style.transform='translateY(-8px)';
      setTimeout(()=>{
        if(out===views[curTab])return;            /* 若期间切回该视图则保持显示 */
        out.style.display='none';
        out.style.opacity=''; out.style.transform=''; out.style.transition='';
      },160);
    }
    if(inn){
      inn.style.display='block';
      inn.style.transition='none';
      inn.style.opacity='0';
      inn.style.transform='translateY(14px)';
      void inn.offsetHeight;                      /* 强制回流，确保起始状态生效 */
      inn.style.transition='opacity .3s ease, transform .3s cubic-bezier(.22,.61,.36,1)';
      inn.style.opacity='1';
      inn.style.transform='translateY(0)';
    }
    if(name==='analyze')renderAnalyze();
  }
  document.querySelectorAll('.sub-nav .tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

  /* =============== 底部 Dock 切换 =============== */
  const screens=[...document.querySelectorAll('.screen')];
  const dockItems=[...document.querySelectorAll('.dock-item')];
  const dockPill=$('dockPill');
  let curScreen='countdown', switching=false;

  /* 高亮胶囊跟随选中项滑动 */
  function movePill(){
    const active=dockItems.find(b=>b.classList.contains('active'));
    if(!active)return;
    const dr=$('dock').getBoundingClientRect(), ar=active.getBoundingClientRect();
    dockPill.style.left=(ar.left-dr.left)+'px';
    dockPill.style.width=ar.width+'px';
  }

  function switchScreen(name){
    if(name===curScreen||switching)return;
    const from=screens.find(s=>s.dataset.screen===curScreen);
    const to=screens.find(s=>s.dataset.screen===name);
    if(!to)return;
    switching=true;

    dockItems.forEach(b=>{                     // Dock 高亮立即反馈
      const on=b.dataset.screen===name;
      b.classList.toggle('active',on);
      b.setAttribute('aria-selected',on?'true':'false');
    });
    movePill();

    const showTo=()=>{
      if(from)from.classList.remove('active','leaving');
      to.classList.add('active');
      curScreen=name;switching=false;
      if(name==='score')renderAnalyze();
      window.scrollTo({top:0,behavior:'smooth'});
    };

    if(from){                                  // 旧卡片原位淡出，结束后新卡片淡入
      from.classList.add('leaving');
      let done=false;
      const show=()=>{if(done)return;done=true;showTo()};
      from.addEventListener('animationend',show,{once:true});
      setTimeout(show,400);                    // 兜底：动画被禁用时也能切换
    }else{
      showTo();
    }
  }
  dockItems.forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.screen)));

  /* =============== 启动 =============== */
  applyLayoutMode();
  applyCdMode();
  renderSubjects();refreshInput();renderRecords();renderCd();
  movePill();
  window.addEventListener('resize',movePill);
  setInterval(renderCd,1000);
  switchTab('input');

  /* =============== 全局交互：下拉关闭 / 原生日期时间选择器 =============== */
  document.addEventListener('click',()=>{
    document.querySelectorAll('.dropdown.open').forEach(d=>{
      d.classList.remove('open');
      const t=d.querySelector('.dd-trigger');if(t)t.setAttribute('aria-expanded','false');
    });
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      document.querySelectorAll('.dropdown.open').forEach(d=>d.classList.remove('open'));
    }
  });
  /* 点击日期/时间输入框任意位置直接弹出选择器（比只点小图标更友好） */
  document.addEventListener('click',e=>{
    const t=e.target;
    if(t&&t.tagName==='INPUT'&&(t.type==='date'||t.type==='time')){
      try{if(typeof t.showPicker==='function')t.showPicker()}catch(err){}
    }
  });
})();
</script>
</body>
</html>
